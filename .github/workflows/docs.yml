name: Docs

on:
  push:
    branches: [main]
  pull_request:
  # A weekly run, on Mondays, finds links to other sites that stopped working.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check the docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      # mkdocstrings reads the code without running it, so this runner needs none of the app's
      # Windows-only dependencies.
      - name: Install the docs tools
        run: python -m pip install --group docs
      - name: Build the site
        run: zensical build --strict
      # Zensical checks the links between pages as it builds, and lychee then checks every link
      # inside the built site.
      - name: Check the links inside the site
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --exclude-path 'site/404\.html'
            'site/**/*.html'
          fail: true
      # Pull requests and the weekly run also check the links to other sites, except the addresses
      # in .lycheeignore. A push to main leaves them out, so another site's outage can't hold the
      # site back.
      - name: Check the links to other sites
        if: github.event_name != 'push'
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --scheme https
            --scheme http
            --max-retries 3
            --retry-wait-time 5
            --timeout 30
            --exclude-path 'site/404\.html'
            'site/**/*.html'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload the site
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Pull requests and the weekly run stop after the checks. A push to main, or a run started by
  # hand on main, publishes the site.
  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
